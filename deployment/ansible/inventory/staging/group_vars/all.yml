---
admin_username: admin
deploy_username: deploy

ssh_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh"

admin_public_key: >-
  {{ (lookup('ansible.builtin.env', 'ADMIN_PUBLIC_KEY')
      or lookup('ansible.builtin.file', ssh_dir ~ '/admin.pub'))
     | trim }}

deploy_public_key: >-
  {{ (lookup('ansible.builtin.env', 'DEPLOY_PUBLIC_KEY')
      or lookup('ansible.builtin.file', ssh_dir ~ '/deploy.pub'))
     | trim }}

admin_authorized_keys:
  - "{{ admin_public_key }}"

deploy_authorized_keys:
  - "{{ deploy_public_key }}"

deploy_shell: /bin/bash

admin_groups:
  - sudo

deploy_groups:
  - docker

ssh_port: 2238

firewall_allowed_ports:
  - port: 2238
    proto: tcp
  - port: 8080
    proto: tcp

firewall_logging: low