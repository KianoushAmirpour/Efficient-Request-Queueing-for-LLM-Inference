---
admin_username: admin
deploy_username: deploy

admin_authorized_keys:
  - "{{ lookup('ansible.builtin.file', '~/.ssh/admin.pub') | trim }}"

deploy_authorized_keys:
  - "{{ lookup('ansible.builtin.file', '~/.ssh/deploy.pub') | trim }}"

deploy_shell: /bin/bash

admin_groups:
  - sudo

deploy_groups:
  - docker

ssh_port: 2238

firewall_allowed_ports: []

firewall_logging: low