---
- name: Guard against SSH lockout
  ansible.builtin.assert:
    that:
      - ansible_user is defined
      - ssh_hardening_sshd_allowed_users | length > 0
      - ansible_user in ssh_hardening_sshd_allowed_users
    fail_msg: >
      SSH hardening aborted. The Ansible user must be included
      in sshd_allowed_users.
  tags: [ssh_hardening, ssh_validation]


- name: Check administrator authorized_keys
  ansible.builtin.stat:
    path: "/home/{{ admin_username }}/.ssh/authorized_keys"
  register: ssh_hardening_admin_keys_file

- name: Validate administrator authorized_keys
  ansible.builtin.assert:
    that:
      - ssh_hardening_admin_keys_file.stat.exists
      - ssh_hardening_admin_keys_file.stat.size | int > 0
    fail_msg: "Missing or empty authorized_keys for {{ admin_username }}"

- name: Check deployment authorized_keys
  ansible.builtin.stat:
    path: "/home/{{ deploy_username }}/.ssh/authorized_keys"
  register: ssh_hardening_deploy_keys_file

- name: Validate deployment authorized_keys
  ansible.builtin.assert:
    that:
      - ssh_hardening_deploy_keys_file.stat.exists
      - ssh_hardening_deploy_keys_file.stat.size | int > 0
    fail_msg: "Missing or empty authorized_keys for {{ deploy_username }}"

- name: Deploy SSH hardening configuration
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: "{{ ssh_hardening_sshd_binary }} -t -f %s"
  notify: Reload SSH
  tags: [ssh_hardening, ssh_config]

- name: Apply SSH configuration changes
  ansible.builtin.meta: flush_handlers
  tags: [ssh_hardening, ssh_config]

- name: Inspect effective SSH configuration
  ansible.builtin.command:
    cmd: "{{ ssh_hardening_sshd_binary }} -T"
  register: ssh_hardening_sshd_effective
  changed_when: false
  tags: [ssh_hardening, ssh_validation]

- name: Verify effective SSH configuration
  ansible.builtin.assert:
    that:
      - "'permitrootlogin no' in ssh_hardening_sshd_effective.stdout_lines"
      - "'passwordauthentication no' in ssh_hardening_sshd_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in ssh_hardening_sshd_effective.stdout_lines"
      - "'pubkeyauthentication yes' in ssh_hardening_sshd_effective.stdout_lines"
      - "'permitemptypasswords no' in ssh_hardening_sshd_effective.stdout_lines"
      - "'usepam yes' in ssh_hardening_sshd_effective.stdout_lines"
      - >-
        (ssh_hardening_sshd_effective.stdout_lines
        | select('match', '^allowusers ')
        | map('regex_replace', '^allowusers ', '')
        | list | sort)
        ==
        (ssh_hardening_sshd_allowed_users | sort)
    fail_msg: "Effective SSH configuration does not match the hardening policy."
  tags: [ssh_hardening, ssh_validation]

- name: Reset SSH connection
  ansible.builtin.meta: reset_connection
  tags: [ssh_hardening, connectivity]

- name: Verify Ansible connectivity
  ansible.builtin.wait_for_connection:
    timeout: 30
    sleep: 3
  tags: [ssh_hardening, connectivity]
