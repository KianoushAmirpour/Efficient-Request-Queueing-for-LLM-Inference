---
# SSH service configuration
ssh_hardening_sshd_service_name: ssh
ssh_hardening_sshd_binary: /usr/sbin/sshd
ssh_hardening_sshd_port: "{{ ansible_port | default(22) }}"

# Users permitted to connect through SSH
ssh_hardening_sshd_allowed_users:
  - admin
  - deploy

# Authentication
ssh_hardening_sshd_permit_root_login: "no"
ssh_hardening_sshd_password_authentication: "no"
ssh_hardening_sshd_kbd_interactive_authentication: "no"
ssh_hardening_sshd_pubkey_authentication: "yes"
ssh_hardening_sshd_permit_empty_passwords: "no"

# Authentication limits
ssh_hardening_sshd_max_auth_tries: 3
ssh_hardening_sshd_login_grace_time: 30

# Connection limits
ssh_hardening_sshd_max_startups: "10:30:60"
ssh_hardening_sshd_max_sessions: 3

# Connection liveness
ssh_hardening_sshd_client_alive_interval: 300
ssh_hardening_sshd_client_alive_count_max: 2

# Forwarding restrictions
ssh_hardening_sshd_allow_agent_forwarding: "no"
ssh_hardening_sshd_allow_tcp_forwarding: "no"
ssh_hardening_sshd_allow_stream_local_forwarding: "no"
ssh_hardening_sshd_x11_forwarding: "no"
ssh_hardening_sshd_permit_tunnel: "no"

# Additional security
ssh_hardening_sshd_permit_user_environment: "no"
ssh_hardening_sshd_gssapi_authentication: "no"
ssh_hardening_sshd_hostbased_authentication: "no"
ssh_hardening_sshd_ignore_rhosts: "yes"
ssh_hardening_sshd_strict_modes: "yes"

# Keep PAM enabled for account/session management
ssh_hardening_sshd_use_pam: "yes"

# Logging
ssh_hardening_sshd_log_level: VERBOSE
