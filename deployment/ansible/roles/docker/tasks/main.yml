---
- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [docker, docker_config]

- name: Remove conflicting Docker packages
  ansible.builtin.apt:
    name: "{{ docker_conflicting_packages }}"
    state: absent
    purge: true
  tags: [docker, packages]

- name: Download Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  tags: [docker, docker_config]

- name: Configure official Docker APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_facts.architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts.distribution_release }} stable
    filename: docker
    state: present
    update_cache: true
  tags: [docker, docker_config]

- name: Install Docker Engine and supported plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  tags: [docker, packages]

- name: Ensure Docker configuration directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [docker, docker_config]

- name: Configure Docker daemon
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "data-root": "{{ docker_data_root }}",
        "ip": "{{ docker_default_bind_ip }}",
        "default-network-opts": {
          "bridge": {
            "com.docker.network.bridge.host_binding_ipv4": "{{ docker_default_bind_ip }}"
          }
        },
        "live-restore": {{ docker_live_restore | bool | lower }},
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "{{ docker_log_max_size }}",
          "max-file": "{{ docker_log_max_file }}"
        },
        "icc": false,
        "userland-proxy": false
      }
    validate: "python3 -m json.tool %s"
  notify: Restart Docker
  tags: [docker, docker_config]

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  tags: [docker, services]

- name: Ensure containerd service is enabled and running
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
  tags: [docker, services]

- name: Add deployment user to the Docker group
  ansible.builtin.user:
    name: "{{ deploy_username }}"
    groups:
      - docker
    append: true
  when: docker_deploy_user_in_group | bool
  tags: [docker, users]

- name: Create deployment workspace
  ansible.builtin.file:
    path: "/opt/{{ deploy_username }}"
    state: directory
    owner: "{{ deploy_username }}"
    group: "{{ deploy_username }}"
    mode: "0750"
  tags: [docker, users]

- name: Check Docker configuration directory
  ansible.builtin.stat:
    path: /etc/docker
  register: audit_docker_config
  tags: [docker, auditd]

- name: Validate Docker audit rule prerequisites
  ansible.builtin.assert:
    that:
      - audit_docker_config.stat.exists
      - audit_docker_config.stat.isdir
  when: audit_docker_rules | default(false) | bool
  tags: [docker, auditd]
