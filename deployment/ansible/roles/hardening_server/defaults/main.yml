  - inetutils-inetd
  - openbsd-inetd
  - rsh-server
  - rsh-redone-server
  - telnetd
  - tftpd-hpa
  - atftpd
  - nis
  - ypserv
  - prelink
  - telnet
  - rsh-client
  - rsh-redone-client
  - talk

hardening_server_baseline_packages_install:
