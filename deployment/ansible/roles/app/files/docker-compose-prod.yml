version: "3.9"

services:
  app:
    image: ghcr.io/kianoushamirpour/efficient-request-queueing-for-llm-inference:sha-3b082d2
    container_name: app
    env_file:
      - /opt/app/.env
    environment:
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      CFG_PATH: /app/configs
      GIN_MODE: release
      POSTGRES_HOST: postgres
      REDIS_HOST: redis-stack
    ports:
      - "0.0.0.0:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - internal

  migrate:
    image: ghcr.io/kianoushamirpour/efficient-request-queueing-for-llm-inference-migrate:sha-445f7bc
    container_name: migrate
    profiles:
      - migration
    env_file:
      - /opt/app/.env
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgres://${MIGRATION_USER}:${MIGRATION_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE}"
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"


  redis-stack:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis-stack
    environment:
      - REDIS_ARGS=--appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy volatile-lru
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  postgres:
    image:  ghcr.io/kianoushamirpour/efficient-request-queueing-for-llm-inference-postgres:sha-445f7bc
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KIAN_ADMIN_PASSWORD: ${KIAN_ADMIN_PASSWORD}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - internal

  grafana:
    image: grafana/grafana:13.1
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - internal

  victorialogs:
    image: victoriametrics/victoria-logs:v1.42.0
    container_name: victorialogs
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=14d"
    ports:
      - "127.0.0.1:9428:9428"
    volumes:
      - victorialogs_data:/victoria-logs-data
    restart: unless-stopped
    networks:
      - internal

  vector:
    image: timberio/vector:0.50.0-debian
    container_name: vector
    command:
      - "--config"
      - "/etc/vector/vector.yaml"
    volumes:
      - ./vector/vector.yml:/etc/vector/vector.yaml:ro
      - vector_data:/var/lib/vector
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - victorialogs

    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  victorialogs_data:
  vector_data: