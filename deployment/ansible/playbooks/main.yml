---
- name: Setup staging VM
  hosts: staging
  become: true
  gather_facts: true

  pre_tasks:
    - name: Verify supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version is version("22.04", ">=")
        fail_msg: "This playbook targets Ubuntu Server 22.04 or newer."
      tags: packages

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 86400
      tags: always

  roles:
    - hardening_server
    - firewall
    - users
    - ssh_hardening
    - docker
    - app
