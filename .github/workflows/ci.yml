
name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deployment/ansible/**'

  pull_request:
    paths-ignore:
      - 'deployment/ansible/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6
        with:
          version: v2.15.0

  verify:
    name: Verify Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (
            echo "Error: go.mod or go.sum is not tidy. Please run 'go mod tidy' and commit the changes."
            exit 1
          )

  go-build:
    name: Build Go packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Compile all packages
        run: go build ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, verify]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  changes:
    name: Detect Docker image changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6
        with:
          filters: |
            app:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'infra/Dockerfile'
              - '.dockerignore'
              - 'configs/**'

            migrate:
              - 'deployment/migrations/**'
              - 'migrations/**'
              - '.dockerignore'

            postgres:
              - 'deployment/postgres/**'
              - '.dockerignore'

      - name: Generate build matrix
        id: matrix
        env:
          APP_CHANGED: ${{ steps.filter.outputs.app }}
          MIGRATE_CHANGED: ${{ steps.filter.outputs.migrate }}
          POSTGRES_CHANGED: ${{ steps.filter.outputs.postgres }}
        run: |
          matrix=$(jq -cn \
            --arg app "$APP_CHANGED" \
            --arg migrate "$MIGRATE_CHANGED" \
            --arg postgres "$POSTGRES_CHANGED" \
            '[
              (if $app == "true" then {
                name: "app",
                scan: true,
                image_suffix: "",
                dockerfile: "./infra/Dockerfile",
                context: ".",
                cache_scope: "app",
                max_size_mb: 100
              } else empty end),

              (if $migrate == "true" then {
                name: "migrate",
                scan: false,
                image_suffix: "-migrate",
                dockerfile: "./deployment/migrations/Dockerfile.migrate",
                context: ".",
                cache_scope: "migrate",
                max_size_mb: 100
              } else empty end),

              (if $postgres == "true" then {
                name: "postgres",
                scan: false,
                image_suffix: "-postgres",
                dockerfile: "./deployment/postgres/Dockerfile.postgres",
                context: ".",
                cache_scope: "postgres",
                max_size_mb: 700
              } else empty end)
            ]')

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          echo "Selected images:"
          echo "$matrix" | jq .

  docker-image:
    name: Build, Scan and Publish (${{ matrix.name }})
    environment: staging
    needs: [lint, verify, go-build, test, changes]

    if: needs.changes.outputs.matrix != '[]'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.image_suffix }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Validate Goose version
        if: matrix.name == 'migrate'
        env:
          GOOSE_VERSION: ${{ vars.GOOSE_VERSION }}
        run: |
          test -n "$GOOSE_VERSION" || {
            echo "::error::GOOSE_VERSION repository variable is missing"
            exit 1
          }

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.name == 'migrate' && format('GOOSE_VERSION={0}', vars.GOOSE_VERSION) || '' }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

      - name: Scan Docker image with Trivy
        if: matrix.scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Check Docker image size
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          MAX_SIZE_MB: ${{ matrix.max_size_mb }}
        run: |
          SIZE_BYTES=$(docker image inspect "$IMAGE" --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))

          echo "Image size: ${SIZE_MB} MB"
          echo "Maximum allowed: ${MAX_SIZE_MB} MB"

          if (( SIZE_MB > MAX_SIZE_MB )); then
            echo "::error::Image exceeds the maximum allowed size"
            exit 1
          fi

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$TAGS"
