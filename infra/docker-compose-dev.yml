version: "3.9"

services:
  redis-stack:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis-stack
    environment:
      REDIS_ARGS: --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  postgres:
    image: postgres:17
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KIAN_ADMIN_PASSWORD: ${KIAN_ADMIN_PASSWORD}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./pg_db/scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml
      - prometheus_data_dev:/prometheus
    restart: unless-stopped
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - internal
  
  victorialogs:
    image: victoriametrics/victoria-logs:v1.42.0
    container_name: victorialogs
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=14d"
    ports:
      - "9428:9428"
    volumes:
      - victorialogs_data_dev:/victoria-logs-data
    restart: unless-stopped
    networks:
      - internal

  vector:
    image: timberio/vector:0.50.0-debian
    container_name: vector
    command:
      - "--config"
      - "/etc/vector/vector.yaml"
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector_data_dev:/var/lib/vector
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - victorialogs

    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data_dev:
  redis_data_dev:
  prometheus_data_dev:
  grafana_data_dev:
  victorialogs_data_dev:
  vector_data_dev:
