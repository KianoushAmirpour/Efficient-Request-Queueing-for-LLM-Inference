version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: efficient_request_queue
    env_file:
      - ../.env
    environment:
      CFG_PATH: /app/configs
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"  
    networks:
      - internal

  redis-stack:
    image: redis/redis-stack:7.4.0-v8
    container_name: redis-stack
    environment:
      - REDIS_ARGS=--appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"   
      - "8001:8001"             
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  postgres:
    image:  postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KIAN_ADMIN_PASSWORD: ${KIAN_ADMIN_PASSWORD}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg_db/scripts:/docker-entrypoint-initdb.d

    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - internal
   
  victorialogs:
    image: victoriametrics/victoria-logs:v1.42.0
    container_name: victorialogs
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-retentionPeriod=14d"
    ports:
      - "9428:9428"
    volumes:
      - victorialogs_data:/victoria-logs-data
    restart: unless-stopped
    networks:
      - internal

  vector:
    image: timberio/vector:0.50.0-debian
    container_name: vector
    command:
      - "--config"
      - "/etc/vector/vector.yaml"
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector_data:/var/lib/vector
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      - victorialogs

    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  victorialogs_data:
  vector_data:
